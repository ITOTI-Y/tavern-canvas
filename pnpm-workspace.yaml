packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  # better-sqlite3 ships prebuilt binaries for every supported platform.
  better-sqlite3: false
  esbuild: true
  # Pulled in by @huggingface/transformers; the tokenizer never runs ONNX inference, protobuf or
  # image resizing, so their native builds are not needed.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
minimumReleaseAgeExclude:
  - express-rate-limit@8.6.2
  - tsx@4.23.9
