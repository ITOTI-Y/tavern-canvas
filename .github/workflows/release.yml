name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Full history: the release audit's legacy-history rule reads the released ref's ancestry,
      # and a shallow clone would let a legacy path pass unseen simply because its commit is absent.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run checks
        run: pnpm check

      - name: Run Gateway tests
        run: pnpm test:gateway

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Package the extension
        run: pnpm package:extension

      - name: Audit the release archive
        run: node tools/release_audit/dist/index.js output/release/tavern-canvas.zip

      - name: Verify the checksum sidecar
        working-directory: output/release
        run: sha256sum --check tavern-canvas.zip.sha256

      - name: Verify committed dist matches a clean rebuild
        run: git diff --exit-code -- dist

      - name: Verify the rebuild added no untracked runtime file
        run: |
          untracked="$(git ls-files --others --exclude-standard -- dist)"
          if [ -n "$untracked" ]; then
            echo "A clean rebuild changed dist/ outside the committed tree:" >&2
            echo "$untracked" >&2
            exit 1
          fi

      - name: Upload the release archive
        uses: actions/upload-artifact@v5
        with:
          name: tavern-canvas-release
          path: |
            output/release/tavern-canvas.zip
            output/release/tavern-canvas.zip.sha256
          if-no-files-found: error
