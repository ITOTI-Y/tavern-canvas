name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run checks
        run: pnpm check

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Package the extension
        run: pnpm package:extension

      - name: Audit the release archive
        run: node tools/release_audit/dist/index.js output/release/tavern-canvas.zip

      - name: Verify the checksum sidecar
        working-directory: output/release
        run: sha256sum --check tavern-canvas.zip.sha256

      - name: Verify committed dist matches a clean rebuild
        run: git diff --exit-code -- dist

      - name: Verify the rebuild added no untracked runtime file
        run: |
          untracked="$(git ls-files --others --exclude-standard -- dist)"
          if [ -n "$untracked" ]; then
            echo "A clean rebuild changed dist/ outside the committed tree:" >&2
            echo "$untracked" >&2
            exit 1
          fi

      # Byte-compares a fresh rebuild of the committed vocabulary baseline
      # (apps/extension/public/vocabulary/baseline) against the committed
      # data/vocabulary/raw_vocabulary_tags_public.jsonl source.
      - name: Verify vocabulary baseline reproducibility
        run: pnpm exec tsx tools/vocabulary_builder/scripts/generate_baseline.ts --check
